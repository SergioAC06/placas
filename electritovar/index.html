function ic(k){ return I[k] || I.link || ''; }
function esc(s){
return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
});
}
var app = document.getElementById('app');
var paso = 0;
function add(html){
var d = document.createElement('div');
d.className = 'rv';
d.style.animationDelay = (paso++ * 58) + 'ms';
d.innerHTML = html;
app.appendChild(d);
return d;
}
function wa(t){ return 'https://wa.me/' + String(t || '').replace(/\D/g, ''); }
function buzz(){ try { if (navigator.vibrate) navigator.vibrate(11); } catch(e){} }
function url(b){
if (b.url) return b.url;
if (b.tipo === 'whatsapp'  && b.telefono)  return wa(b.telefono) + (b.mensaje ? '?text=' + encodeURIComponent(b.mensaje) : '');
if (b.tipo === 'llamar'    && b.telefono)  return 'tel:' + String(b.telefono).replace(/[^\d+]/g, '');

}

}

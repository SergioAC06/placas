+ '<div class="txt"><b>' + esc(b.titulo) + '</b>'
+ (b.sub ? '<small>' + esc(b.sub) + '</small>' : '') + '</div>'
+ '<div class="chev">' + ic('chev') + '</div></a>');
});
if (CFG.feedback && CFG.feedback.telefono) {
var f = CFG.feedback;
add('<a class="quiet" href="' + esc(wa(f.telefono) + '?text=' + encodeURIComponent(f.mensaje || 'Hola, quiero darles una sugerencia.')) + '" target="_blank" rel="noopener">'
+ '<u>' + esc(f.titulo || 'Algo que podamos mejorar? Escribenos en privado') + '</u></a>');
}
var C = CFG.contacto;
if (C && (C.telefono || C.email)) {
var caja = add('<button class="btn" style="margin-top:6px">'
+ '<div class="ico">' + ic('contacto') + '</div>'
+ '<div class="txt"><b>Guardar contacto</b><small>Agrega el numero a tu celular</small></div>'
+ '<div class="chev">' + ic('descargar') + '</div></button>');
caja.querySelector('button').onclick = function(){
var L = ['BEGIN:VCARD','VERSION:3.0','FN:' + (CFG.negocio || ''),'ORG:' + (CFG.negocio || '')];
if (C.telefono)  L.push('TEL;TYPE=WORK,VOICE:' + C.telefono);
if (C.email)     L.push('EMAIL;TYPE=WORK:' + C.email);
if (C.web)       L.push('URL:' + C.web);
if (C.direccion) L.push('ADR;TYPE=WORK:;;' + C.direccion + ';;;;');
L.push('END:VCARD');
var a = document.createElement('a');
a.href = URL.createObjectURL(new Blob([L.join('\r\n')], { type:'text/vcard;charset=utf-8' }));
a.download = (CFG.slug || 'contacto') + '.vcf';
a.click();
setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
buzz();
};
}
if (CFG.credito !== false) {
add('<div class="sep"></div><div class="cred">'
+ (CFG.credito_html || ('Placa NFC instalada por <a href="' + esc(wa(CFG.credito_tel || '')) + '" target="_blank" rel="noopener">quieres una para tu negocio?</a>'))
+ '</div>');
}
document.title = CFG.titulo_pagina || CFG.negocio || 'Enlaces';</script>
</body>
</html>
